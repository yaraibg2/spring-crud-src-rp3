<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<title>会員登録入力 | シェアードショップ</title>
<meta charset="UTF-8" />
</head>
<body class="admin user_regist_input_admin">
		<h3>社員登録入力画面</h3>
    <div class="update">
      <form th:action="@{/regist/check}" method="post" th:object="${employeeForm}">
        <!-- エラーメッセージの出力 -->
        <p>
          <span th:each="error:${#fields.detailedErrors()}">
            <span th:text="${error.message}" style="color: red;"></span><br />
          </span>
        </p>

        <div class="form">
          <div class="label">パスワード：</div>
          <div class="input">
            <input type="password" th:field="*{empPass}" />
          </div>
        </div>
        <div class="form">
          <div class="label">社員名：</div>
          <div class="input">
            <input type="text" th:field="*{empName}" />
          </div>
        </div>
        <div class="form">
          <div class="label">性別：</div>
          <div class="input">
            <input type="radio" th:field="*{gender}" value="1" id="male" />
            <label for="male" class="radio-label">&nbsp;&nbsp;男性&nbsp;&nbsp;</label>
            <input type="radio" th:field="*{gender}" value="2" id="female" />&nbsp;
            <label for="female" class="radio-label">&nbsp;&nbsp;女性&nbsp;&nbsp;</label>
          </div>
        </div>
        <div class="form">
          <div class="label">住所：</div>
          <div class="input">
            <input type="text" th:field="*{address}" />
          </div>
        </div>
        <div class="form">
          <div class="label">生年月日：</div>
          <div class="input">
            <input type="text" th:field="*{birthday}" /> (YYYY/MM/DD)
          </div>
        </div>
        <div class="form">
          <div class="label">権限：</div>
          <div class="input">
            <input type="radio" th:field="*{authority}" value="1" id="general" />
            <label for="general" class="radio-label">&nbsp;&nbsp;一般&nbsp;&nbsp;</label>
            <input type="radio" th:field="*{authority}" value="2" id="admin" />&nbsp;
            <label for="admin" class="radio-label">&nbsp;&nbsp;管理者&nbsp;&nbsp;</label>
          </div>
        </div>
        <div class="form">
          <div class="label">部署名：</div>
          <div class="input">
            <select th:field="*{deptId}">
              <option value="1">営業部</option>
              <option value="2">経理部</option>
              <option value="3">総務部</option>
            </select>
          </div>
        </div>
        <div class="form">
          <div class="label"></div>
          <div class="input">
            <input type="submit" value="登録" />
          </div>
        </div>
      </form>
      <form th:action="@{/list}">
        <div class="form">
          <div class="label"></div>
          <div class="input">
            <input type="submit" value="戻る" />
          </div>
        </div>
      </form>
    </div>
</body>
</html>
